# Copy, do not symlink: certbot edits it. Replace geoai.example.com, APP_ROOT (the checkout folder)
# and APP_USER (the user that owns it) before enabling.
# The domain must NOT go through the Cloudflare proxy (DNS only, grey cloud): Cloudflare cuts a request
# after 100 s (error 524), an analysis takes minutes. Passenger open source itself allows up to 10 min.
# The Passenger pool is shared by all apps of this nginx: when another app already sets
# passenger_max_pool_size or passenger_max_instances_per_app, setting them here fails `nginx -t`.

server {
    listen 80;
    listen [::]:80;
    server_name geoai.example.com;

    # Passenger wants a public dir; the app serves no static files
    root APP_ROOT/public;

    passenger_enabled on;
    passenger_app_root APP_ROOT;
    # $PORT is replaced by Passenger (not an nginx variable); the server listens on 127.0.0.1 only.
    passenger_app_start_command "APP_ROOT/.venv/bin/argo-geoai serve --host 127.0.0.1 --port $PORT";
    # a generic app has no startup file whose owner Passenger could take: name the user
    passenger_user APP_USER;
    passenger_group APP_USER;
    passenger_app_env production;

    passenger_force_max_concurrent_requests_per_process 0;
    passenger_min_instances 1;
    passenger_start_timeout 120;

    client_max_body_size 5m;

    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
    location = /robots.txt {
        passenger_enabled off;
        add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
    }

    access_log /var/log/nginx/argo_geoai.access.log;
    error_log /var/log/nginx/argo_geoai.error.log;
}

passenger_pre_start https://geoai.example.com/health;
